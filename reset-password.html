<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f16">
  <link rel="icon" href="squadup-logo.svg" type="image/svg+xml">
  <title>Reset password · SquadUp</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0f16;--panel:#161925;--text:#f4f3ff;--muted:#a3a5b8;--line:#2a2d3b;--accent:#8b73ff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 20% 0%,rgba(139,115,255,.18),transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(440px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.3)}
    h1{margin:0 0 8px;font-size:26px;letter-spacing:-.04em}
    p{color:var(--muted);font-size:14px;line-height:1.6}
    label{display:grid;gap:8px;margin:18px 0;font-size:13px;font-weight:650}
    input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#10121b;color:var(--text);font:inherit}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,115,255,.18)}
    button{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(110deg,#795cff,#a353dc);color:white;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #notice{min-height:24px;color:#ded7ff;font-size:13px}
    .warning{padding:10px 12px;border:1px solid rgba(245,158,11,.3);border-radius:10px;background:rgba(245,158,11,.08);color:#f5d69a}
    a{color:#c4b8ff}
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p id="instructions">We’ll email you a secure link to reset your password.</p>
    <form id="request-form">
      <label for="email">Email address<input id="email" type="email" autocomplete="email" required></label>
      <button id="request-submit" type="submit">Send reset link</button>
    </form>
    <form id="password-form" hidden>
      <label for="password">New password<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
      <label for="confirm-password">Confirm new password<input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
      <button id="submit" type="submit">Update password</button>
    </form>
    <p id="notice" role="status" aria-live="polite"></p>
    <a href="login.html">Back to log in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = window.squadUpSupabase;
    const notice = document.getElementById("notice");
    const params = new URLSearchParams(location.search);
    document.getElementById("email").value = params.get("email") || "";
    const requestForm = document.getElementById("request-form");
    const passwordForm = document.getElementById("password-form");
    function show(message) {
      notice.textContent = message;
    }
    function showPasswordForm() {
      requestForm.hidden = true;
      passwordForm.hidden = false;
      document.getElementById("instructions").textContent = "Choose a new password for your account.";
      show("");
    }
    const recoveryLink = new URLSearchParams(location.hash.slice(1)).get("type") === "recovery";
    if (recoveryLink) showPasswordForm();
    if (window.squadUpSupabaseConfigError) show(window.squadUpSupabaseConfigError);
    window.squadUpSupabase?.auth.onAuthStateChange(event => {
      if (event === "PASSWORD_RECOVERY") showPasswordForm();
    });
    requestForm.addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("request-submit");
      button.disabled = true;
      try {
        if (window.squadUpSupabaseConfigError) throw new Error(window.squadUpSupabaseConfigError);
        if (!client) throw new Error("Live accounts are not configured yet. Add the Supabase project URL and public anon key to supabase-config.js.");
        const redirectTo = new URL("reset-password.html", location.href).href;
        const { error } = await client.auth.resetPasswordForEmail(
          document.getElementById("email").value.trim(),
          { redirectTo }
        );
        if (error) throw error;
        show("If an account exists for that email, a password reset link has been sent.");
      } catch (error) {
        show(error.message || "Could not send the reset email.");
      } finally {
        button.disabled = false;
      }
    });
    passwordForm.addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("submit");
      button.disabled = true;
      try {
        if (!client) throw new Error("Live accounts are not configured. Return to the reset email link and try again.");
        const password = document.getElementById("password").value;
        if (password !== document.getElementById("confirm-password").value) {
          throw new Error("The passwords do not match.");
        }
        const { data: { session }, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;
        if (!session) throw new Error("This reset link is invalid or has expired. Request a new one.");
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        await client.auth.signOut();
        const target = new URL("login.html?password_updated=1", location.href);
        for (const key of ["next", "to", "name"]) {
          const value = params.get(key);
          if (value) target.searchParams.set(key, value);
        }
        location.href = target.href;
      } catch (error) {
        show(error.message || "Could not update your password.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
