<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11121a">
  <link rel="icon" href="squadup-logo.svg" type="image/svg+xml">
  <title>Messages · SquadUp</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0f16;--panel:#161925;--panel-2:#11141e;--text:#f4f3ff;--muted:#979bb0;--line:#292c3b;--accent:#8b73ff;--pink:#ec4899}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100svh;margin:0;overflow-x:hidden;background:radial-gradient(ellipse at 20% 0%,rgba(139,115,255,.13),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit;color:inherit}
    .top{height:68px;padding:0 max(22px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(13,15,22,.82);backdrop-filter:blur(14px)}
    .top-actions{display:flex;align-items:center;gap:14px}
    .top input{width:180px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12px}
    .top input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,115,255,.15)}
    .brand{display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--accent)}.brand img{width:32px;height:32px;filter:drop-shadow(0 3px 8px rgba(139,115,255,.35))}.brand .wordmark-pad{width:24px;height:17px;margin:0 -5px;object-fit:contain}
    .back{color:var(--muted);font-size:14px}.back:hover{color:white}
    main{width:min(1200px,100%);margin:auto;padding:30px 22px 48px}
    .heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}
    .eyebrow{color:#c4b8ff;font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:7px 0 0;font-size:clamp(28px,4vw,38px);letter-spacing:-.045em}
    .status{max-width:430px;padding:9px 12px;border:1px solid rgba(139,115,255,.22);border-radius:10px;background:rgba(139,115,255,.07);color:#c5c2d8;font-size:12px;line-height:1.5}
    .messenger{height:min(680px,calc(100vh - 190px));height:min(680px,calc(100svh - 190px));min-height:360px;display:grid;grid-template-columns:minmax(240px,310px) minmax(0,1fr);overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 28px 90px rgba(0,0,0,.28);animation:enter .45s ease both}
    .sidebar{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(10,12,19,.35)}
    .side-head{padding:19px 17px 14px;border-bottom:1px solid var(--line)}
    .side-head h2{margin:0 0 13px;font-size:15px}
    .search{width:100%;height:39px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:13px}
    .search:focus,.composer input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,115,255,.15)}
    .contact-list{flex:1;min-height:0;overflow:auto;padding:7px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .contact{width:100%;display:flex;gap:11px;align-items:center;padding:11px 10px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer;transition:background .16s,transform .16s}
    .contact:hover{background:rgba(255,255,255,.055);transform:translateX(2px)}
    .contact.active{background:rgba(139,115,255,.15)}
    .avatar{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:linear-gradient(145deg,#765cff,#d14bc0);font-size:13px;font-weight:800}
    .contact-copy{min-width:0;flex:1}
    .contact-name{display:block;overflow:hidden;font-size:13px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .preview{display:block;overflow:hidden;margin-top:4px;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
    .unread{flex:none;min-width:20px;padding:3px 6px;border-radius:999px;background:var(--accent);color:#fff;text-align:center;font-size:10px;font-weight:800}
    .top-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12px;cursor:pointer}
    .empty-contacts{padding:18px 12px;color:var(--muted);font-size:12px;line-height:1.6}
    .conversation{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}
    .conv-head{min-height:72px;padding:13px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
    .conv-name{font-size:14px;font-weight:750}.conv-sub{margin-top:4px;color:var(--muted);font-size:11px}
    .feed{min-height:0;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
    .welcome{margin:auto;max-width:360px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
    .welcome strong{display:block;margin-bottom:6px;color:var(--text);font-size:16px}
    .message{max-width:min(75%,520px);padding:10px 13px;border:1px solid var(--line);border-radius:14px 14px 14px 4px;background:#202331;overflow-wrap:anywhere;animation:enter .2s ease both}
    .message.mine{align-self:flex-end;border-color:transparent;border-radius:14px 14px 4px 14px;background:linear-gradient(135deg,#755bff,#965bde)}
    .message-text{font-size:13px;line-height:1.5;white-space:pre-wrap}
    .message-image{display:block;width:min(100%,360px);max-height:320px;margin-top:7px;border-radius:10px;object-fit:contain;background:rgba(0,0,0,.18)}
    .message-audio{display:block;width:min(100%,300px);margin-top:7px}
    .attachment-actions{min-width:0;display:flex;align-items:center;gap:8px;padding:10px 14px 0;border-top:1px solid var(--line);background:rgba(10,12,19,.28)}
    .attachment-actions[hidden]{display:none}
    .attach-button,.record-button,.remove-attachment{min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12px;cursor:pointer}
    .record-button.recording{border-color:#ef4444;background:rgba(239,68,68,.16);color:#fecaca}
    .record-button:disabled,.attach-button:disabled{cursor:not-allowed;opacity:.5}
    .attachment-preview{min-width:0;flex:1;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
    .remove-attachment{color:#fca5a5}
    .composer{border-top:0}
    .time{margin-top:5px;color:#c0bfd0;font-size:10px}
    .composer{width:100%;min-width:0;display:flex;gap:10px;padding:10px 18px 14px;background:rgba(10,12,19,.28)}
    .composer input{min-width:0;flex:1;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);font-size:13px}
    .send{flex:none;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(110deg,#795cff,#a353dc);font-weight:750;cursor:pointer;transition:filter .16s,transform .16s}
    .send:hover{filter:brightness(1.13);transform:translateY(-1px)}.send:active{transform:scale(.98)}
    .send:disabled,.composer input:disabled{cursor:not-allowed;opacity:.5}
    .mobile-back{display:none;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:transparent;cursor:pointer}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){
      .top{height:auto;min-height:60px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap;gap:8px}
      .brand{font-size:19px;gap:6px}
      .brand img{width:29px;height:29px}
      .brand .wordmark-pad{width:21px;height:15px}
      .top-actions{width:100%;min-width:0;gap:8px}
      .top input{width:auto;min-width:0;flex:1;height:42px}
      .top-actions button{min-height:42px;padding:7px 9px}
      .back{flex:none;font-size:12px;white-space:nowrap}
      main{width:100%;padding:16px max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
      .heading{align-items:start;flex-direction:column;margin-bottom:14px}
      .status{max-width:none}
      .messenger{height:calc(100vh - 250px);height:clamp(240px,calc(100dvh - 250px),680px);min-height:0;grid-template-columns:minmax(0,1fr);border-radius:14px}
      .sidebar,.conversation{grid-row:1;grid-column:1}
      .messenger.show-conversation .sidebar{display:none}
      .messenger:not(.show-conversation) .conversation{display:none}
      .mobile-back{display:block;min-width:44px;min-height:44px;padding:6px 9px}
      .contact{min-height:60px;padding:10px}
      .conv-head{min-height:60px;padding:8px 10px;gap:9px}
      .feed{padding:12px}
      .message{max-width:88%;padding:10px 12px}
      .attachment-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:7px;padding:8px 10px 0}
      .attach-button,.record-button,.remove-attachment{min-height:42px;padding:0 8px;font-size:11px}
      .attachment-preview{grid-column:1/-1;order:0;min-height:18px}
      .composer{gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
      .composer input{height:46px;padding:0 12px;font-size:16px}
      .send{min-width:64px;min-height:46px;padding:0 12px}
    }
    @media(max-width:360px){
      .top{padding-right:max(9px,env(safe-area-inset-right,0px));padding-left:max(9px,env(safe-area-inset-left,0px))}
      main{padding-right:max(9px,env(safe-area-inset-right,0px));padding-left:max(9px,env(safe-area-inset-left,0px))}
      .top-actions{gap:6px}
      .top-actions button{padding-inline:7px;font-size:11px}
      .back{font-size:11px}
      .status{font-size:11px}
      .attachment-actions{padding-right:7px;padding-left:7px}
      .attach-button,.record-button,.remove-attachment{padding-inline:6px;font-size:10px}
    }
    @media(max-width:700px) and (max-height:500px){
      .top{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:4px}
      .top-actions{width:auto;margin-left:auto}
      .top input{flex:0 1 120px;height:38px}
      main{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
      .heading{align-items:center;flex-direction:row;gap:10px;margin-bottom:8px}
      .eyebrow{font-size:9px}
      h1{margin-top:2px;font-size:24px}
      .status{max-width:60%;padding:6px 8px;font-size:10px}
      .messenger{height:calc(100dvh - 150px);min-height:200px}
      .conv-head{min-height:48px}
      .contact{min-height:48px;padding:6px 9px}
      .feed{padding:8px}
      .composer{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}
      .composer input,.send{height:40px;min-height:40px}
    }
    @media(hover:none){
      .contact:hover,.send:hover{transform:none}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
<style>
.sq-message-link{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none;padding:8px 5px;overflow:visible}
.sq-badge-anchor{position:relative;display:inline-flex;align-items:center;overflow:visible}
.sq-unread-badge{position:absolute;right:-11px;top:-10px;display:flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#ef233c;color:white;font:700 10px/1 system-ui;border:2px solid #171824;box-sizing:border-box;z-index:2}
.sq-unread-badge[hidden]{display:none}.sq-bell .sq-unread-badge{right:-8px;top:-7px}
.receipt.read{color:#68cfff;font-weight:600}
</style><link rel="stylesheet" href="community.css"><link rel="stylesheet" href="app-polish.css"><link rel="stylesheet" href="media-update.css"></head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="SquadUp home"><img src="squadup-logo.svg" alt=""><span>Squad</span><img class="wordmark-pad" src="squadup-gamepad.svg" alt="" aria-hidden="true"><span>Up</span></a>
    <div class="top-actions"><a class="sq-message-link" href="messages.html" aria-label="Messages"><span class="sq-badge-anchor">Messages</span><span class="sq-badge-anchor sq-bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="sq-unread-badge" hidden></span></span></a><input id="gamer-tag" type="text" maxlength="20" placeholder="Your gamer tag" aria-label="Your gamer tag" readonly><button id="logout" type="button">Log out</button><a class="back" href="index.html">← Find players</a></div>
  </header>
  <main>
    <div class="heading">
      <div><div class="eyebrow">SquadUp inbox</div><h1>Messages</h1></div>
      <div class="status" id="status" role="status">Loading your conversations…</div>
    </div>
    <section class="messenger" id="messenger" aria-label="Direct messages">
      <aside class="sidebar" aria-label="Players">
        <div class="side-head"><h2>Players</h2><input class="search" id="search" type="search" placeholder="Search players…" aria-label="Search players"></div>
        <div class="contact-list" id="contacts"></div>
      </aside>
      <section class="conversation" aria-label="Conversation">
        <header class="conv-head">
          <button class="mobile-back" id="mobile-back" type="button" aria-label="Back to player list">←</button>
          <div class="avatar" id="active-avatar">?</div>
          <div><div class="conv-name" id="active-name">Choose a player</div><div class="conv-sub" id="active-sub">Start a conversation</div></div>
        </header>
        <div class="social-chat-controls" id="social-chat-controls" hidden><button type="button" id="chat-add-friend">Add friend</button><button type="button" id="chat-block">Block player</button><button type="button" id="chat-report">Report</button></div><div class="game-id-detail" id="game-id-detail"></div><div class="typing-line" id="typing-line" aria-live="polite"></div><div class="feed" id="feed" aria-live="polite"><div class="welcome"><strong>Your squad starts with a hello.</strong>Choose any registered player to start a conversation.</div></div>
        <div class="attachment-actions" id="attachment-actions" hidden>
          <input id="video-file" type="file" accept="video/mp4,video/webm,video/quicktime" hidden><button id="choose-video" class="attach-button" type="button" title="Send video" aria-label="Send video" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 10 6-4v12l-6-4z"/></svg></button><input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button class="attach-button" id="choose-photo" type="button" disabled title="Send image" aria-label="Send image"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 5"/></svg></button>
          <button class="record-button" id="record-voice" type="button" disabled title="Record voice message" aria-label="Record voice message"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
          <span class="attachment-preview" id="attachment-preview" aria-live="polite">Live text chat is available.</span>
          <button class="remove-attachment" id="remove-attachment" type="button" hidden>Remove</button>
        </div>
        <form class="composer" id="composer">
          <input id="message" type="text" maxlength="300" placeholder="Write a message…" autocomplete="off" aria-label="Write a message" disabled>
          <button class="send" id="send" type="submit" disabled>Send</button>
        </form>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value==null?"":value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const client=window.squadUpSupabase;
    const params=new URLSearchParams(location.search);
    let uid="",selected="",profiles=new Map(),messages=[],channel=null,searchTimer=0,pendingAttachment=null,pendingVideo=null,mediaRecorder=null,recordingStream=null,recordingChunks=[],recordingTimer=0,recordingSeconds=0,sending=false;
    function setVoiceIcon(state,seconds=0){
      const button=$("record-voice");
      const label=state==="recording"?"Stop voice recording":state==="preparing"?"Preparing voice note":"Record voice message";
      button.innerHTML=(state==="recording"?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>')+(state==="recording"?`<span class="record-time">0:${String(seconds).padStart(2,"0")}</span>`:"");
      button.title=label;button.setAttribute("aria-label",label);button.setAttribute("aria-pressed",String(state==="recording"));
    }
    function setStatus(message){$("status").textContent=message}
    function messageTime(value){return new Date(value).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
    function selectedMessages(peer){return messages.filter(item=>(item.sender_id===uid&&item.recipient_id===peer)||(item.sender_id===peer&&item.recipient_id===uid))}
    function latestMessage(peer){return selectedMessages(peer).at(-1)}
    function unreadCount(peer){return messages.filter(item=>item.sender_id===peer&&item.recipient_id===uid&&!item.read_at).length}
    function attachmentPreview(message){return message.body|| (message.attachment?.type==="image"?"Photo":message.attachment?.type==="audio"?"Voice note":message.attachment?.type==="video"?"Video":"")}
    function clearAttachment(){
      pendingAttachment=null;pendingVideo=null;
      $("video-file").value="";
      $("photo-file").value="";
      $("attachment-preview").textContent="Choose a photo, video or voice note.";
      $("remove-attachment").hidden=true;
      updateSendButton();
    }
    function showPendingAttachment(attachment){
      if(attachment.type!=="video")pendingVideo=null;
      pendingAttachment=attachment;
      $("attachment-preview").textContent=`${attachment.type==="image"?"Photo":attachment.type==="video"?"Video":"Voice note"} attached: ${attachment.name}`;
      $("remove-attachment").hidden=false;
      updateSendButton();
    }
    function updateSendButton(){$("send").disabled=!!window.SquadCommunity?.blocked(selected)||sending||!selected||!!mediaRecorder||(!$("message").value.trim()&&!pendingAttachment)}
    function updateAttachmentControls(){
      $("attachment-actions").hidden=!selected;
      $("choose-photo").disabled=!selected||!!mediaRecorder||sending;
      $("choose-video").disabled=!selected||!!mediaRecorder||sending;
      $("record-voice").disabled=!selected||sending;
      $("remove-attachment").disabled=!!mediaRecorder||sending;
      updateSendButton();
    }
    const videoUrls=new Map();
    async function signChatVideo(path){
      if(!path||videoUrls.get(path)?.expires>Date.now())return;
      const {data,error}=await client.storage.from("squad-media").createSignedUrl(path,3600);
      if(!error)videoUrls.set(path,{url:data.signedUrl,expires:Date.now()+3500000});
    }
    function renderAttachment(attachment){
      if(attachment?.type==="video"){
        const url=videoUrls.get(attachment.path)?.url;
        return url?`<video class="message-video" src="${esc(url)}" controls playsinline preload="metadata"></video>`:'<span class="video-unavailable">Video unavailable — reopen the conversation to retry.</span>';
      }
      if(!attachment?.dataUrl)return"";
      if(attachment.type==="image"&&!/^data:image\/(jpeg|png|webp);base64,/.test(attachment.dataUrl))return"";
      if(attachment.type==="audio"&&!/^data:audio\/(webm|ogg|mp4|mpeg)[^,]*;base64,/.test(attachment.dataUrl))return"";
      const source=esc(attachment.dataUrl);
      if(attachment.type==="image")return`<img class="message-image" src="${source}" alt="Photo attachment" loading="lazy">`;
      if(attachment.type==="audio")return`<audio class="message-audio" controls preload="metadata" src="${source}">Your browser cannot play this voice note.</audio>`;
      return"";
    }
    function renderContacts(){
      const query=$("search").value.trim().toLowerCase();
      const list=[...profiles.values()].filter(profile=>profile.gamer_tag.toLowerCase().includes(query));
      list.sort((a,b)=>{
        const aMessage=latestMessage(a.id),bMessage=latestMessage(b.id);
        return (Date.parse(bMessage?.created_at||"")||0)-(Date.parse(aMessage?.created_at||"")||0)||a.gamer_tag.localeCompare(b.gamer_tag);
      });
      $("contacts").innerHTML=list.length?list.map(profile=>{
        const preview=latestMessage(profile.id);
        const unread=unreadCount(profile.id);
        return `<button class="contact ${profile.id===selected?"active":""}" type="button" data-peer="${esc(profile.id)}"><span class="avatar">${esc(profile.gamer_tag.slice(0,2).toUpperCase())}</span><span class="contact-copy"><span class="contact-name">${esc(profile.gamer_tag)}${window.SquadCommunity?.online(profile.id)?'<small class="player-online"> · Online</small>':''}</span><span class="preview">${esc(preview?attachmentPreview(preview):"Start a conversation")}</span></span>${unread?`<span class="unread" aria-label="${unread} unread messages">${unread>9?"9+":unread}</span>`:""}</button>`;
      }).join(""):'<div class="empty-contacts">No players found. Search by gamer tag, or invite a friend to create an account.</div>';
    }
    function renderConversation(){
      const profile=profiles.get(selected);
      if(!profile){
        $("active-name").textContent="Choose a player";
        $("active-avatar").textContent="?";
        $("active-sub").textContent="Start a conversation";
        $("feed").innerHTML='<div class="welcome"><strong>Your squad starts with a hello.</strong>Choose a player to start a direct conversation.</div>';
        $("message").disabled=true;
        $("send").disabled=true;
        updateAttachmentControls();
        return;
      }
      $("active-name").textContent=profile.gamer_tag;
      paintSocialChat();
      $("active-avatar").textContent=profile.gamer_tag.slice(0,2).toUpperCase();
      $("active-sub").textContent=[profile.game,profile.platform,profile.region].filter(Boolean).join(" · ")||"SquadUp player";
      const items=selectedMessages(selected);
      $("feed").innerHTML=items.length?items.map(item=>`<div class="message ${item.sender_id===uid?"mine":""}">${item.body?`<div class="message-text">${esc(item.body)}</div>`:""}${renderAttachment(item.attachment)}<div class="time">${item.sender_id===uid?"You":esc(profile.gamer_tag)} · ${messageTime(item.created_at)}${item.sender_id===uid?` · <span class="receipt ${item.read_at?'read':'sent'}">${item.read_at?'✓✓ Read':'✓ Sent'}</span>`:""}</div></div>`).join(""):'<div class="welcome"><strong>Say hello to '+esc(profile.gamer_tag)+'.</strong>Keep it friendly and never share passwords or sensitive personal information.</div>';
      $("feed").scrollTop=$("feed").scrollHeight;
      $("message").disabled=false;
      $("send").disabled=false;
      updateAttachmentControls();
    }
    function render(){
      renderContacts();
      renderConversation();
    }
    async function loadProfiles(query=""){
      if(!client||!uid)return;
      let request=client.from("profiles").select("id,gamer_tag,game,platform,region").neq("id",uid).order("gamer_tag").limit(100);
      if(query)request=request.ilike("gamer_tag",`%${query}%`);
      const {data,error}=await request;
      if(error){setStatus("Could not load players: "+error.message);return}
      profiles=new Map((data||[]).map(profile=>[profile.id,profile]));
      const requested=params.get("to");
      if(requested&&requested!==uid&&!profiles.has(requested)){
        const {data:person,error:profileError}=await client.from("profiles").select("id,gamer_tag,game,platform,region").eq("id",requested).maybeSingle();
        if(profileError)setStatus("Could not load requested player: "+profileError.message);
        else if(person)profiles.set(person.id,person);
      }
      render();
      if(requested&&requested!==uid&&profiles.has(requested))selectContact(requested);
    }
    async function refreshMessages(){
      const {data,error}=await client.from("direct_messages").select("id,sender_id,recipient_id,body,attachment,created_at,read_at").or(`sender_id.eq.${uid},recipient_id.eq.${uid}`).order("created_at",{ascending:false}).limit(500);
      if(error){setStatus("Could not load messages: "+error.message);return}
      messages=(data||[]).reverse();
      await Promise.all([...new Set(selectedMessages(selected).filter(x=>x.attachment?.type==="video").map(x=>x.attachment.path))].map(signChatVideo));
      render();
      await markVisibleMessagesRead();
    }
    async function selectContact(peer){
      if(!profiles.has(peer))return;
      if(sending||uploadingVideo){setStatus("Please wait for your video to finish sending.");return}
      if(mediaRecorder){setStatus("Stop the voice recording before changing conversations.");return}
      if(selected!==peer&&pendingAttachment)clearAttachment();
      selected=peer;
      $("messenger").classList.add("show-conversation");
      render();
      await markVisibleMessagesRead();
      await refreshMessages();
      $("message").focus();
    }
    let markingRead=false;
    async function markVisibleMessagesRead(){
      if(markingRead||!selected||document.visibilityState!=="visible"||!document.hasFocus())return;
      const ids=messages.filter(item=>item.sender_id===selected&&item.recipient_id===uid&&!item.read_at).map(item=>item.id);
      if(!ids.length)return;
      markingRead=true;
      try{
        const now=new Date().toISOString();
        const {error}=await client.from("direct_messages").update({read_at:now}).in("id",ids).eq("recipient_id",uid).is("read_at",null);
        if(error){setStatus("Could not update read receipts: "+error.message);return;}
        const readIds=new Set(ids);
        messages.forEach(item=>{if(readIds.has(item.id))item.read_at=now;});
        renderContacts();
        window.dispatchEvent(new Event("squadup:refresh-unread"));
      }finally{markingRead=false;}
    }
    window.addEventListener("focus",()=>markVisibleMessagesRead().catch(error=>setStatus(error.message)));
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshMessages().catch(error=>setStatus(error.message));});
    function fileAsDataUrl(blob,onloadError){
      const reader=new FileReader();
      reader.onload=()=>typeof reader.result==="string"?showPendingAttachment({
        type:"audio",name:`Voice note (${recordingSeconds}s)`,mime:blob.type,dataUrl:reader.result
      }):setStatus("Could not prepare the voice note.");
      reader.onerror=()=>setStatus(onloadError);
      reader.readAsDataURL(blob);
    }
    let uploadingVideo=false;
    $("choose-video").onclick=()=>$("video-file").click();
    $("video-file").onchange=event=>{
      const file=event.target.files[0];if(!file)return;
      if(!["video/mp4","video/webm","video/quicktime"].includes(file.type)||file.size>25*1024*1024){setStatus("Choose an MP4, WebM or MOV video up to 25 MB. MP4 works on the most devices.");event.target.value="";return;}
      pendingVideo=file;showPendingAttachment({type:"video",name:file.name,mime:file.type});
    };
    $("choose-photo").addEventListener("click",()=>$("photo-file").click());
    $("photo-file").addEventListener("change",event=>{
      const file=event.currentTarget.files[0];
      if(!file)return;
      if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5*1024*1024){
        event.currentTarget.value="";
        setStatus("Choose a JPG, PNG, or WebP photo smaller than 5 MB.");
        return;
      }
      const reader=new FileReader();
      reader.onerror=()=>setStatus("Could not read the selected photo.");
      reader.onload=()=>{
        const image=new Image();
        image.onerror=()=>setStatus("That photo could not be opened. Try a different image.");
        image.onload=()=>{
          const scale=Math.min(1,1280/Math.max(image.width,image.height));
          const canvas=document.createElement("canvas");
          canvas.width=Math.max(1,Math.round(image.width*scale));
          canvas.height=Math.max(1,Math.round(image.height*scale));
          const context=canvas.getContext("2d");
          if(!context){setStatus("Could not prepare this photo in your browser.");return}
          context.drawImage(image,0,0,canvas.width,canvas.height);
          canvas.toBlob(blob=>{
            if(!blob){setStatus("Could not prepare this photo in your browser.");return}
            if(blob.size>1024*1024){setStatus("This photo is still too large after resizing. Choose a smaller image.");return}
            const dataReader=new FileReader();
            dataReader.onerror=()=>setStatus("Could not prepare this photo for sending.");
            dataReader.onload=()=>typeof dataReader.result==="string"?showPendingAttachment({
              type:"image",name:file.name,mime:"image/jpeg",dataUrl:dataReader.result
            }):setStatus("Could not prepare this photo for sending.");
            dataReader.readAsDataURL(blob);
          },"image/jpeg",0.82);
        };
        if(typeof reader.result==="string")image.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
    $("remove-attachment").addEventListener("click",clearAttachment);
    $("record-voice").addEventListener("click",async()=>{
      if(mediaRecorder){
        $("record-voice").disabled=true;
        setVoiceIcon("preparing");
        clearInterval(recordingTimer);
        if(mediaRecorder.state!=="inactive")mediaRecorder.stop();
        return;
      }
      if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){
        setStatus("Voice recording is not supported in this browser. Try opening SquadUp on localhost or HTTPS.");
        return;
      }
      try{
        recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
        const mimeTypes=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4"];
        const mimeType=mimeTypes.find(type=>MediaRecorder.isTypeSupported(type));
        mediaRecorder=mimeType?new MediaRecorder(recordingStream,{mimeType}):new MediaRecorder(recordingStream);
        recordingChunks=[];
        recordingSeconds=0;
        mediaRecorder.ondataavailable=event=>{if(event.data.size)recordingChunks.push(event.data)};
        mediaRecorder.onerror=()=>setStatus("Voice recording failed. Check microphone access and try again.");
        mediaRecorder.onstop=()=>{
          clearInterval(recordingTimer);
          const recorder=mediaRecorder;
          mediaRecorder=null;
          recordingStream?.getTracks().forEach(track=>track.stop());
          recordingStream=null;
          $("record-voice").classList.remove("recording");
          setVoiceIcon("idle");
          updateAttachmentControls();
          const blob=new Blob(recordingChunks,{type:recorder.mimeType||"audio/webm"});
          recordingChunks=[];
          if(blob.size>1024*1024){setStatus("Voice notes must be smaller than 1 MB. Record a shorter note and try again.");return}
          if(blob.size===0){setStatus("The voice note was empty. Please record again.");return}
          fileAsDataUrl(blob,"Could not prepare the voice note for sending.");
        };
        mediaRecorder.start();
        $("record-voice").classList.add("recording");
        setVoiceIcon("recording",0);
        updateAttachmentControls();
        recordingTimer=window.setInterval(()=>{
          recordingSeconds+=1;
          setVoiceIcon("recording",recordingSeconds);
          if(recordingSeconds>=30)$("record-voice").click();
        },1000);
      }catch(error){
        recordingStream?.getTracks().forEach(track=>track.stop());
        recordingStream=null;
        mediaRecorder=null;
        setStatus(error.name==="NotAllowedError"?"Microphone access was blocked. Allow microphone access and try again.":"Could not start voice recording: "+error.message);
        updateAttachmentControls();
      }
    });
    async function start(){
      if(window.squadUpSupabaseConfigError){
        setStatus("Shared chat is unavailable: "+window.squadUpSupabaseConfigError);
      }
      if(!client){
        const setupMessage=window.squadUpSupabaseConfigError||"Add your Supabase project URL and public anon key in supabase-config.js, then run supabase-setup.sql.";
        setStatus("Shared messaging is unavailable: "+setupMessage+" ");
        $("status").insertAdjacentHTML("beforeend",'<a href="login.html?next=messages.html" style="color:#c4b8ff;text-decoration:underline">Log in</a> · <a href="signup.html?next=messages.html" style="color:#c4b8ff;text-decoration:underline">Create account</a>');
        $("contacts").innerHTML='<div class="empty-contacts">Connect the shared account service to find players and message them.</div>';
        $("message").disabled=true;
        $("send").disabled=true;
        return;
      }
      const {data:{session},error}=await client.auth.getSession();
      if(error){setStatus("Could not check your login: "+error.message);return}
      if(!session){
        setStatus("Log in to use messaging. ");
        $("status").innerHTML='Log in to use messaging. <a href="login.html?next=messages.html" style="color:#c4b8ff;text-decoration:underline">Log in</a> · <a href="signup.html?next=messages.html" style="color:#c4b8ff;text-decoration:underline">Create account</a>';
        $("contacts").innerHTML='<div class="empty-contacts">Sign in to find players and send private messages.</div>';
        $("message").disabled=true;
        $("send").disabled=true;
        return;
      }
      uid=session.user.id;
      const {data:profile,error:profileError}=await client.from("profiles").select("gamer_tag").eq("id",uid).maybeSingle();
      if(profileError){setStatus("Could not load your profile: "+profileError.message);return}
      $("gamer-tag").value=profile?.gamer_tag||session.user.user_metadata?.gamer_tag||"Player";
      $("gamer-tag").readOnly=true;
      await loadProfiles();
      await refreshMessages();
      if(channel)await client.removeChannel(channel);
      channel=client.channel("direct-messages-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"direct_messages"},()=>refreshMessages()).subscribe((state)=>{
        if(state==="SUBSCRIBED")setStatus("Connected · messages update live");
        if(state==="CHANNEL_ERROR"||state==="TIMED_OUT")setStatus("Realtime connection problem. Check your internet and Supabase settings.");
      });
      client.auth.onAuthStateChange((event)=>{
        if(event==="SIGNED_OUT")location.href="login.html?next=messages.html";
      });
    }
    $("contacts").addEventListener("click",event=>{
      const button=event.target.closest("[data-peer]");
      if(button)selectContact(button.dataset.peer);
    });
    $("message").addEventListener("input",updateSendButton);
    $("search").addEventListener("input",()=>{
      clearTimeout(searchTimer);
      searchTimer=setTimeout(()=>loadProfiles($("search").value.trim()),250);
    });
    $("mobile-back").addEventListener("click",()=>$("messenger").classList.remove("show-conversation"));
    $("composer").addEventListener("submit",async event=>{
      event.preventDefault();
      const body=$("message").value.trim();
      if(window.SquadCommunity?.blocked(selected)){setStatus("Unblock this player in Friends & squads before messaging.");return;}
      if(sending||!selected||(!body&&!pendingAttachment)||body.length>300)return;
      if(mediaRecorder){setStatus("Stop the voice recording before sending.");return}
      $("send").disabled=true;
      sending=true;updateAttachmentControls();$("message").disabled=true;
      let error=null,uploadedPath=null;
      const peer=selected;
      try{
        let attachment=pendingAttachment;
        if(pendingVideo){
          uploadingVideo=true;setStatus("Uploading video…");
          const ext=pendingVideo.type==="video/mp4"?"mp4":pendingVideo.type==="video/webm"?"webm":"mov";
          uploadedPath=`dm/${uid}/${peer}/${crypto.randomUUID()}.${ext}`;
          const upload=await client.storage.from("squad-media").upload(uploadedPath,pendingVideo,{contentType:pendingVideo.type,upsert:false});
          if(upload.error)throw upload.error;
          attachment={type:"video",path:uploadedPath,name:pendingVideo.name,mime:pendingVideo.type};
        }
        const result=await client.from("direct_messages").insert({sender_id:uid,recipient_id:peer,body,attachment});
        if(result.error)throw result.error;
      }catch(e){error=e;if(uploadedPath)await client.storage.from("squad-media").remove([uploadedPath]);}
      finally{uploadingVideo=false;sending=false;$("message").disabled=false;updateAttachmentControls();}
      $("send").disabled=false;
      if(error){setStatus("Message not sent: "+error.message);return}
      $("message").value="";
      window.SquadCommunity?.type(selected,false);
      clearAttachment();
      setStatus("Connected · messages update live");
      await refreshMessages();
    });
    $("logout").addEventListener("click",async()=>{
      if(!client){location.href="login.html?next=messages.html";return}
      const {error}=await client.auth.signOut();
      if(error){setStatus("Could not log out: "+error.message);return}
      location.href="login.html";
    });
    window.addEventListener("pagehide",()=>{
      clearInterval(recordingTimer);
      if(mediaRecorder?.state==="recording")mediaRecorder.stop();
      recordingStream?.getTracks().forEach(track=>track.stop());
    });
    function paintSocialChat(){
      const social=window.SquadCommunity;
      $("social-chat-controls").hidden=!selected;
      if(!selected)return;
      const p=social?.profile(selected);
      $("game-id-detail").textContent=p?.game_ids?Object.entries(p.game_ids).filter(([g,id])=>id).map(([g,id])=>g+": "+id).join(" · "):"";
      $("typing-line").textContent=social?.blocked(selected)?"Player blocked. Manage blocks in Friends & squads.":social?.typing(selected)?"Typing…":social?.online(selected)?"Online":"";
      $("chat-block").textContent=social?.blocked(selected)?"Unblock":"Block";
      const friendState=social?.friendState(selected)||"none";
      $("chat-add-friend").textContent=friendState==="accepted"?"Friends ✓":friendState==="pending"?"Requested":friendState==="incoming"?"Accept friend":"Add friend";
      $("chat-add-friend").disabled=["accepted","pending"].includes(friendState)||!!social?.blocked(selected);
      updateSendButton();
    }
    let lastTypingAt=0;
    $("message").addEventListener("input",()=>{
      if(Date.now()-lastTypingAt>2000){lastTypingAt=Date.now();window.SquadCommunity?.type(selected,!!$("message").value.trim());}
    });
    $("message").addEventListener("blur",()=>window.SquadCommunity?.type(selected,false));
    window.addEventListener("squadup:social-updated",()=>{renderContacts();paintSocialChat();});
    setInterval(paintSocialChat,1000);
    async function socialAction(button,work){
      button.disabled=true;
      try{await work();}catch(error){setStatus(error.message||"Could not complete this action. Please try again.");}
      finally{button.disabled=false;paintSocialChat();}
    }
    $("chat-add-friend").onclick=()=>socialAction($("chat-add-friend"),async()=>{
      if(!selected)throw new Error("Choose a player first.");
      const social=window.SquadCommunity;
      if(!social?.ready())throw new Error("Friends are still loading. If this continues, run community-setup.sql in Supabase.");
      const state=social.friendState(selected);
      const action=state==="incoming"?"accept":"request";
      const {error}=await client.rpc("squad_friend_action",{peer:selected,action});
      if(error)throw error;
      await social.refresh();
      setStatus(action==="accept"?"Friend request accepted.":"Friend request sent.");
    });
    $("chat-block").onclick=()=>socialAction($("chat-block"),async()=>{
      if(!selected)return;
      const social=window.SquadCommunity;
      if(!social?.ready())throw new Error("Player controls are still loading. Please try again shortly.");
      const blocked=social.blocked(selected);
      if(!confirm(blocked?"Unblock this player?":"Block this player? New messages between you will be blocked."))return;
      if(blocked)await social.unblock(selected);else await social.block(selected);
      setStatus(blocked?"Player unblocked.":"Player blocked.");
    });
    $("chat-report").onclick=()=>socialAction($("chat-report"),async()=>{
      if(!selected)return;
      if(!window.SquadCommunity?.ready())throw new Error("Reports are still loading. Please try again shortly.");
      const reason=prompt("Describe the problem (5–500 characters). Reports go to the site owner for review.");
      if(reason===null)return;
      if(reason.trim().length<5||reason.trim().length>500)throw new Error("Enter a reason between 5 and 500 characters.");
      await window.SquadCommunity.report(selected,reason.trim());setStatus("Report submitted to the site owner.");
    });
    start().catch(error=>setStatus("Messaging could not start: "+error.message));
  </script>
